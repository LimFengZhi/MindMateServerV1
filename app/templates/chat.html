{% extends "app_base.html" %}
{% set active_page = "chat" %}

{% block title %}Chat{% endblock %}

{% block topbar_title %}
  <strong id="currentSessionTitle" class="topbar-title">Chat</strong>
  <span id="modeBadge" class="tag experiment hidden">supervised</span>
{% endblock %}

{% block main %}
  <main class="content">
    <div id="panels">
      <section class="panel">
        <div id="chatPanel" class="panel-body">
          <div class="welcome-msg">
            <h2>What is on your mind?</h2>
            <p>Peer Support Counselling Service</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Shown only before the chat's first message; the choice is fixed after that. -->
  <div id="modeToggle" class="mode-toggle">
    <label>
      <input id="experimentChk" type="checkbox" onchange="setExperimentMode(this.checked)" />
      <span>Experiment mode — every reply is reviewed live by a counsellor before you see it</span>
    </label>
  </div>

  <footer id="composer">
    <textarea id="message" rows="1" placeholder="Type your message…"
      onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); send();}"></textarea>
    <button id="voiceBtn" class="btn btn-icon" onclick="startVoice()" title="Record voice">🎤</button>
    <button id="sendBtn" class="btn btn-primary" onclick="send()">Send</button>
  </footer>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
{% endblock %}
